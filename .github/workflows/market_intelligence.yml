name: Market Intelligence JSON

on:
  schedule:
    # Intraday broad UTC windows covering both EDT and EST.
    # market_intelligence.py will decide whether New York time
    # is actually between 09:30 and 11:30.

    - cron: '30,45 13 * * 1-5'
    - cron: '0,15,30,45 14 * * 1-5'
    - cron: '0,15,30,45 15 * * 1-5'
    - cron: '0,15,30 16 * * 1-5'

    # EOD
    # EDT: 20:35 UTC = 16:35 New York
    # EST: 21:35 UTC = 16:35 New York
    - cron: '35 20 * * 1-5'
    - cron: '35 21 * * 1-5'

  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - intraday
          - eod

permissions:
  contents: write

concurrency:
  group: market-intelligence-json
  cancel-in-progress: true

jobs:
  generate-market-intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy pyyaml

      - name: Determine requested mode
        id: mode
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            MODE="${{ inputs.mode }}"
          else
            MODE="auto"
          fi

          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Requested mode: $MODE"

      - name: Generate market intelligence JSON
        shell: bash
        run: |
          set -euo pipefail

          echo "Running market_intelligence.py"

          python market_intelligence.py \
            --mode "${{ steps.mode.outputs.mode }}"

          echo
          echo "Files currently in watchlists/:"
          ls -lah watchlists || true

      - name: Validate generated JSON
        shell: bash
        run: |
          set -euo pipefail

          python << 'PY'
          import json
          from pathlib import Path

          market_path = Path("watchlists/latest_market.json")

          if not market_path.exists():
              print("No latest_market.json exists.")
              print(
                  "This is acceptable only if AUTO ran "
                  "outside a valid New York market window."
              )
              raise SystemExit(0)

          with market_path.open("r", encoding="utf-8") as f:
              market = json.load(f)

          required_market = {
              "schema_version",
              "generated_at_utc",
              "market_date",
              "market_mode",
              "market_regime",
              "benchmarks",
              "breadth",
              "sector_performance",
              "key_market_metrics",
          }

          missing = required_market - set(market)

          if missing:
              raise SystemExit(
                  "latest_market.json missing keys: "
                  f"{sorted(missing)}"
              )

          mode = market.get("market_mode")

          print(f"Detected generated mode: {mode}")

          if mode == "eod":
              path = Path(
                  "watchlists/latest_universe.json"
              )

              if not path.exists():
                  raise SystemExit(
                      "EOD mode expected "
                      "watchlists/latest_universe.json"
                  )

              with path.open(
                  "r",
                  encoding="utf-8",
              ) as f:
                  data = json.load(f)

              required = {
                  "schema_version",
                  "generated_at_utc",
                  "market_date",
                  "universe_size",
                  "valid_ticker_count",
                  "breadth",
                  "stocks",
              }

              missing = required - set(data)

              if missing:
                  raise SystemExit(
                      "latest_universe.json missing keys: "
                      f"{sorted(missing)}"
                  )

              if not isinstance(
                  data["stocks"],
                  list,
              ):
                  raise SystemExit(
                      "latest_universe.json stocks must be a list"
                  )

              if (
                  data["valid_ticker_count"]
                  != len(data["stocks"])
              ):
                  raise SystemExit(
                      "latest_universe.json "
                      "valid_ticker_count mismatch"
                  )

              coverage = (
                  data["valid_ticker_count"]
                  / max(
                      data["universe_size"],
                      1,
                  )
              )

              if coverage < 0.80:
                  raise SystemExit(
                      "EOD universe coverage too low: "
                      f"{coverage:.1%}"
                  )

              print(
                  "EOD universe validation passed: "
                  f"{data['valid_ticker_count']}/"
                  f"{data['universe_size']}"
              )

          elif mode == "intraday":
              path = Path(
                  "watchlists/"
                  "latest_intraday_universe.json"
              )

              if not path.exists():
                  raise SystemExit(
                      "Intraday mode expected "
                      "watchlists/"
                      "latest_intraday_universe.json"
                  )

              with path.open(
                  "r",
                  encoding="utf-8",
              ) as f:
                  data = json.load(f)

              required = {
                  "schema_version",
                  "generated_at_utc",
                  "market_date",
                  "data_timestamp",
                  "universe_size",
                  "valid_ticker_count",
                  "breadth",
                  "stocks",
              }

              missing = required - set(data)

              if missing:
                  raise SystemExit(
                      "latest_intraday_universe.json "
                      "missing keys: "
                      f"{sorted(missing)}"
                  )

              if not isinstance(
                  data["stocks"],
                  list,
              ):
                  raise SystemExit(
                      "latest_intraday_universe.json "
                      "stocks must be a list"
                  )

              if (
                  data["valid_ticker_count"]
                  != len(data["stocks"])
              ):
                  raise SystemExit(
                      "latest_intraday_universe.json "
                      "valid_ticker_count mismatch"
                  )

              coverage = (
                  data["valid_ticker_count"]
                  / max(
                      data["universe_size"],
                      1,
                  )
              )

              if coverage < 0.65:
                  raise SystemExit(
                      "Intraday universe coverage too low: "
                      f"{coverage:.1%}"
                  )

              expected_breadth = {
                  "positive_day_pct",
                  "above_vwap_pct",
                  "ema9_above_ema20_pct",
                  "breakout_count",
                  "near_breakout_count",
                  "high_rvol_count",
              }

              breadth = data.get(
                  "breadth",
                  {},
              )

              missing_breadth = (
                  expected_breadth
                  - set(breadth)
              )

              if missing_breadth:
                  raise SystemExit(
                      "Intraday breadth missing keys: "
                      f"{sorted(missing_breadth)}"
                  )

              print(
                  "Intraday universe validation passed: "
                  f"{data['valid_ticker_count']}/"
                  f"{data['universe_size']}"
              )

          else:
              raise SystemExit(
                  "Unexpected market_mode: "
                  f"{mode!r}"
              )

          print("JSON validation passed.")
          PY

      - name: Show JSON changes
        shell: bash
        run: |
          set -euo pipefail

          echo "Git status:"
          git status --short

          echo
          echo "Market intelligence JSON diff:"

          git diff -- \
            watchlists/latest_market.json \
            watchlists/latest_universe.json \
            watchlists/latest_intraday_universe.json \
            || true

      - name: Commit market intelligence JSON
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            watchlists/latest_market.json \
            watchlists/latest_universe.json \
            watchlists/latest_intraday_universe.json \
            2>/dev/null || true

          echo "Staged changes:"
          git diff --cached --name-status

          if git diff --cached --quiet; then
            echo "No Market Intelligence JSON changes to commit."
            exit 0
          fi

          git commit -m "Update market intelligence JSON"

          if ! git push origin "HEAD:${GITHUB_REF_NAME}"; then
            echo "Initial push failed; rebasing and retrying."

            git pull --rebase \
              origin \
              "${GITHUB_REF_NAME}"

            git push origin \
              "HEAD:${GITHUB_REF_NAME}"
          fi
